<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Academic Lesson Deck</title>

  <style>
    /* =========================================================================
       1. GLOBAL STYLES & VARIABLES
    ========================================================================= */
    :root {
      --ielts-red: #c8102e;
      --ielts-red-hover: #a00c24;
      --ielts-dark: #1e242d;
      --stage-bg: #0f1115;
      --panel-bg: #181d24;
      --border-dark: #2d3540;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --amber: #f59e0b;
    }

    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background-color: var(--stage-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }
    * { box-sizing: border-box; }

    /* =========================================================================
       2. HEADER
    ========================================================================= */
    header {
      background-color: var(--ielts-dark);
      padding: 0 20px;
      height: 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000;
      flex-shrink: 0;
      z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .badge-deck {
      background: var(--ielts-red);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .deck-title { font-size: 15px; font-weight: bold; }
    
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .btn-header {
      background: var(--panel-bg);
      border: 1px solid var(--border-dark);
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-header:hover { background: #28313d; border-color: #4b5563; }
    .btn-header.active { background: var(--ielts-red); border-color: var(--ielts-red); }

    /* =========================================================================
       3. WORKSPACE & STAGE (FLEXBOX)
    ========================================================================= */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, #1b2129 0%, #0c0f13 100%);
      overflow: hidden;
      /* Leave room for the persistent dock at the bottom */
      padding-bottom: 150px; 
    }

    /* SLIDE WRAPPERS & IMAGES */
    .slide-wrapper {
      position: absolute;
      inset: 0;
      bottom: 150px; /* Match viewport padding */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }
    .slide-wrapper.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 10;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      background: #fff; /* For transparent PNGs */
      border-radius: 4px;
    }

    /* ARROWS */
    .stage-arrow {
      position: absolute;
      top: calc(50% - 75px); /* Offset for bottom dock */
      transform: translateY(-50%);
      background: rgba(15, 19, 24, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 44px;
      height: 60px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: 0.15s;
      z-index: 20;
    }
    .stage-arrow:hover { background: rgba(200, 16, 46, 0.9); border-color: var(--ielts-red); }
    .arrow-left { left: 16px; }
    .arrow-right { right: 16px; }

    /* =========================================================================
       4. DRAWERS (NOTES & LASER)
    ========================================================================= */
    .notes-drawer {
      width: 320px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border-dark);
      padding: 20px;
      display: none;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      z-index: 30;
      padding-bottom: 160px; /* clear dock */
    }
    .notes-drawer.open { display: flex; }
    .notes-title { font-size: 13px; font-weight: bold; color: var(--amber); margin-bottom: 12px; }
    .notes-body { font-size: 14px; line-height: 1.6; color: #d1d5db; }

    #laser-dot {
      position: fixed;
      width: 12px;
      height: 12px;
      background: #ff0044;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px #ff0044, 0 0 20px #ff0044;
      z-index: 2147483647;
      display: none;
      transform: translate(-50%, -50%);
    }

    /* =========================================================================
       5. CANVA-STYLE PERSISTENT DOCK & FILMSTRIP
    ========================================================================= */
    .ui-dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      background: linear-gradient(to top, #0f1115 65%, transparent);
      pointer-events: auto;
    }

    /* FILMSTRIP */
    .filmstrip {
      display: flex;
      gap: 12px;
      max-width: 92vw;
      overflow-x: auto;
      padding: 4px 8px;
      scroll-behavior: smooth;
      /* Hide scrollbar */
      -ms-overflow-style: none; scrollbar-width: none; 
    }
    .filmstrip::-webkit-scrollbar { display: none; }

    .thumb {
      height: 64px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #374151;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      transition: all 0.15s;
      position: relative;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
    .thumb:hover { border-color: #60a5fa; transform: translateY(-2px); }
    .thumb:hover img { opacity: 1; }
    .thumb.active { border-color: var(--ielts-red); box-shadow: 0 0 10px rgba(200,16,46,0.5); }
    .thumb.active img { opacity: 1; }
    .thumb-num {
      position: absolute;
      bottom: 2px; right: 4px;
      font-size: 10px; font-weight: bold;
      background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 2px;
    }

    /* CONTROL BAR */
    .control-bar {
      background: rgba(30, 31, 34, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 6px 14px;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .icon-btn {
      background: transparent; border: none; color: #b5b7ba;
      width: 32px; height: 32px; border-radius: 4px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .slide-num {
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
      padding: 4px 10px; border-radius: 4px; transition: 0.15s; letter-spacing: 0.5px;
    }
    .slide-num:hover { background: rgba(255,255,255,0.1); }

    .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); }

    .text-btn {
      background: transparent; border: none; color: #b5b7ba;
      font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 4px;
      cursor: pointer; transition: 0.15s;
    }
    .text-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* =========================================================================
       6. FULLSCREEN TRUE-VIEW OVERRIDES
    ========================================================================= */
    body.is-fullscreen header { display: none !important; }
    body.is-fullscreen .ui-dock { display: none !important; }
    body.is-fullscreen .viewport { padding-bottom: 0 !important; }
    body.is-fullscreen .slide-wrapper { bottom: 0 !important; }
    body.is-fullscreen .stage-arrow { top: 50% !important; }
    body.is-fullscreen .notes-drawer { padding-bottom: 0 !important; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <span class="badge-deck">Slide Deck</span>
      <span class="deck-title" id="display-title">Reading Masterclass: Matching Headings</span>
    </div>
    <div class="header-controls">
      <button class="btn-header" id="btn-notes" onclick="toggleNotes()">📝 Teaching Notes</button>
      <button class="btn-header" onclick="toggleFS()">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="workspace">
    <div class="viewport" id="stage">
      <button class="stage-arrow arrow-left" onclick="stepSlide(-1)" title="Previous (Left Arrow)">❮</button>
      
      <!-- Slide wrappers injected here by JS -->

      <button class="stage-arrow arrow-right" onclick="stepSlide(1)" title="Next (Right Arrow)">❯</button>
    </div>

    <!-- NOTES DRAWER -->
    <div class="notes-drawer" id="notes-drawer">
      <div class="notes-title">📌 Teaching Notes</div>
      <div class="notes-body" id="notes-content">Loading...</div>
    </div>
  </div>

  <!-- PERSISTENT DOCK -->
  <div class="ui-dock">
    <div class="filmstrip" id="filmstrip"></div>
    <div class="control-bar">
      <button class="icon-btn" onclick="stepSlide(-1)">◀</button>
      <div class="slide-num" id="slide-num-btn" onclick="promptJump()">1 / 1</div>
      <button class="icon-btn" onclick="stepSlide(1)">▶</button>
      <div class="divider"></div>
      <button class="text-btn" id="btn-laser" onclick="toggleLaser()" title="Laser Pointer (L)">🔴 Laser</button>
      <button class="icon-btn" onclick="toggleFS()" title="Fullscreen (F)">⛶</button>
    </div>
  </div>

  <!-- LASER POINTER -->
  <div id="laser-dot"></div>

      }
    ];

    /* =========================================================================
       ENGINE LOGIC
    ========================================================================= */
    const stage = document.getElementById('stage');
    const filmstrip = document.getElementById('filmstrip');
    const notesContent = document.getElementById('notes-content');
    const counterBtn = document.getElementById('slide-num-btn');
    const titleHeader = document.getElementById('display-title');
    
    let cur = 0;
    let total = DECK_SLIDES.length;
    let laserActive = false;

    // Build the DOM elements from the array
    DECK_SLIDES.forEach((slide, i) => {
      // 1. Build Slide Wrapper
      const wrapper = document.createElement('div');
      wrapper.className = 'slide-wrapper';
      wrapper.id = `slide-wrap-${i}`;
      
      const img = document.createElement('img');
      img.className = 'slide-img';
      img.src = slide.image;
      img.alt = slide.title || `Slide ${i+1}`;
      
      wrapper.appendChild(img);
      
      // Insert before the Right Arrow button so arrows stay on top
      stage.insertBefore(wrapper, document.querySelector('.arrow-right'));

      // 2. Build Filmstrip Thumbnail
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.id = `thumb-${i}`;
      thumb.onclick = () => goTo(i);
      
      thumb.innerHTML = `
        <img src="${slide.image}" alt="Thumb ${i+1}">
        <div class="thumb-num">${i+1}</div>
      `;
      filmstrip.appendChild(thumb);
    });

    function goTo(target) {
      if (target < 0) target = 0;
      if (target >= total) target = total - 1;
      
      // Remove old active states
      document.getElementById(`slide-wrap-${cur}`)?.classList.remove('active');
      document.getElementById(`thumb-${cur}`)?.classList.remove('active');
      
      cur = target;
      
      // Add new active states
      document.getElementById(`slide-wrap-${cur}`).classList.add('active');
      const activeThumb = document.getElementById(`thumb-${cur}`);
      activeThumb.classList.add('active');
      
      // Scroll filmstrip to keep thumbnail in view
      activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      
      // Update UI texts
      counterBtn.textContent = `${cur + 1} / ${total}`;
      titleHeader.textContent = DECK_SLIDES[cur].title || `Slide ${cur + 1}`;
      
      // Load Notes
      notesContent.innerHTML = DECK_SLIDES[cur].notes 
        ? DECK_SLIDES[cur].notes.replace(/\n/g, '<br><br>') 
        : '<em>No notes recorded for this slide.</em>';
    }

    window.stepSlide = function(delta) { goTo(cur + delta); };

    window.promptJump = function() {
      const num = prompt(`Go to slide (1 - ${total}):`, cur + 1);
      if (num && !isNaN(num)) goTo(parseInt(num, 10) - 1);
    };

    window.toggleNotes = function() {
      const drawer = document.getElementById('notes-drawer');
      const btn = document.getElementById('btn-notes');
      const open = drawer.classList.toggle('open');
      btn.classList.toggle('active', open);
    };

    window.toggleFS = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      }
    };

    // Fullscreen Listener to automatically trigger CSS changes
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        document.body.classList.add('is-fullscreen');
      } else {
        document.body.classList.remove('is-fullscreen');
      }
    });

    window.toggleLaser = function() {
      laserActive = !laserActive;
      const laser = document.getElementById('laser-dot');
      const btn = document.getElementById('btn-laser');
      
      laser.style.display = laserActive ? 'block' : 'none';
      document.body.style.cursor = laserActive ? 'none' : 'default';
      btn.style.color = laserActive ? '#ff0044' : '#b5b7ba';
    };

    // Laser Tracker
    window.addEventListener('mousemove', (e) => {
      if (laserActive) {
        const laser = document.getElementById('laser-dot');
        laser.style.left = e.clientX + 'px';
        laser.style.top = e.clientY + 'px';
      }
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); stepSlide(1); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); stepSlide(-1); }
      if (e.key === 'Home') { e.preventDefault(); goTo(0); }
      if (e.key === 'End') { e.preventDefault(); goTo(total - 1); }
      if (e.key.toLowerCase() === 'f') toggleFS();
      if (e.key.toLowerCase() === 'n') toggleNotes();
      if (e.key.toLowerCase() === 'l') toggleLaser();
      if (e.key.toLowerCase() === 'g') promptJump();
    });

    // Init
    goTo(0);
  </script>
